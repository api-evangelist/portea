name: Portea
description: 'Portea Medical is India''s leading home healthcare provider, delivering
  clinical care to patients at home across 40+ cities. Services include physiotherapy,
  nursing care, doctor consultations, medical equipment rental, trained attendants,
  diagnostic and lab tests, counselling, and specialized programs for eldercare,
  mother and baby care, diabetes, critical care, and vaccination. Portea was surfaced
  as a portfolio company of Accel and added to the API Evangelist network. As a
  consumer home-healthcare operator it publishes no public developer API, OpenAPI,
  or developer portal at this time; this profile captures its identity and a live
  domain-security probe.'
